# AI settings. The api_key_env names below are configured examples, not built-in defaults.
# Direct api_key and base_url values take priority over their environment variables.
# A configured base URL gains /v1 unless the address already ends with /v1. Requests use /messages or /responses.
#
# [ai]
# enabled              = true          # false disables the AI chat, its elements and its bindings.
# default_provider     = "anthropic"   # anthropic openai
# statement_timeout_ms = 30000         # time limit for a statement that the model runs
#
# [ai.providers.anthropic]
# model        = "claude-opus-5"
# api_key_env  = "ANTHROPIC_API_KEY"
# api_key      = ""                   # Default: empty.
# base_url     = ""                   # Default: the provider address.
# base_url_env = "ANTHROPIC_BASE_URL" # Example. Default: empty.
#
# [ai.providers.openai]
# model        = "gpt-5"
# api_key_env  = "OPENAI_API_KEY"
# api_key      = ""                   # Default: empty.
# base_url     = ""                   # Default: the provider address.
# base_url_env = "OPENAI_BASE_URL"    # Example. Default: empty.

# MCP server settings. Profile mcp and read-only mode can lower the global access limit.
#
# [mcp]
# profiles   = []            # Allowed profiles. Empty serves none. Example: ["shop"].
# access     = "read-only"   # off read-only read-write full
# row_limit  = 500           # maximum rows one read returns
# timeout_ms = 30000         # Time limit for one agent statement, in milliseconds.
