# AI chat settings. By default the API key is read from an environment variable,
# so it is not stored in this file.
#
# [ai]
# enabled              = true          # false disables every AI feature: the chat cannot open,
#                                      # no AI action has a key binding, and nothing about AI
#                                      # is shown anywhere
# default_provider     = "anthropic"   # anthropic openai
# statement_timeout_ms = 30000         # time limit for a statement that the model runs
#
# [ai.providers.anthropic]
# model        = "claude-opus-5"
# api_key      = "sk-..."              # the key itself, or use the environment variable below
# api_key_env  = "ANTHROPIC_API_KEY"
# base_url     = "https://api.anthropic.com"
# base_url_env = "ANTHROPIC_BASE_URL"
#
# [ai.providers.openai]
# model        = "gpt-5"
# api_key_env  = "OPENAI_API_KEY"
# base_url_env = "OPENAI_BASE_URL"

# MCP server settings. A profile can lower its own access level with `mcp` above.
# No profile can exceed the level set here.
#
# [mcp]
# profiles   = ["a-name"]    # the profiles the server opens. Empty means none is served
# access     = "read-only"   # off read-only read-write full
# row_limit  = 500           # maximum rows one read returns
# timeout_ms = 30000         # time limit for one read
