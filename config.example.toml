# masume config. Copy this to ~/.config/masume/config.toml and edit it.
#
# The path is $XDG_CONFIG_HOME/masume/config.toml, and the themes of the user sit beside it
# in a `themes` directory. A connection written in the client is written back into this file,
# and every other line of it is kept.
#
# Never write a shared or a production password into a file that is tracked in git. Use
# `auth = "prompt"`, `password_command`, or `password_env` instead.

# ─────────────────────────────────────────────────────────────────────────────
# Example profiles. One profile is one connection, and the name after `profile.`
# is what the picker lists.
# ─────────────────────────────────────────────────────────────────────────────

# A local server, asked for its password at connect.
[profile.shop]
engine   = "postgres"
host     = "127.0.0.1"
port     = 5432
database = "shop"
user     = "you"
auth     = "prompt"
env      = "dev"
mode     = "write"
sslmode  = "prefer"

# A file. SQLite needs no host, no port and no user.
[profile.notes]
engine      = "sqlite"
database    = "~/Documents/notes.db"
env         = "dev"
mode        = "write"
description = "The notes database"

# A production server, read only, with its password read from a password manager.
[profile.shop-prod]
engine               = "postgres"
host                 = "db.example.com"
port                 = 5432
database             = "shop"
user                 = "reader"
auth                 = "command"
password_command     = "pass db/shop-prod"
env                  = "prod"
mode                 = "read-only"
sslmode              = "verify-full"
statement_timeout_ms = 30000
mcp                  = "read-only"

# A server behind a jump host. The command runs before the connection opens, the client
# waits for the port, and the command is stopped with the connection.
[profile.shop-tunnel]
engine          = "postgres"
host            = "127.0.0.1"
port            = 15432
database        = "shop"
user            = "reader"
auth            = "prompt"
env             = "prod"
mode            = "read-only"
command         = "ssh -N -L 15432:db.internal:5432 jump.example.com"
command_timeout = 10
wait_for_port   = 15432

[ui]
icons               = "plain"
theme               = "system"
hide_system_schemas = true

[keys]
preset = "default"

# ─────────────────────────────────────────────────────────────────────────────
# Everything else the config file reads. Uncomment a line to set it. The value
# shown after a setting is the one the client uses when the line is left out.
# ─────────────────────────────────────────────────────────────────────────────

# A profile is one connection. The name after `profile.` is what the picker lists.
#
# [profile.a-name]
# engine               = "postgres"   # postgres mysql sqlite redis mongodb cockroach
#                                     # timescale redshift neon supabase mariadb tidb
#                                     # planetscale aurora-mysql
# host                 = "127.0.0.1"
# port                 = 5432         # the port the engine uses where none is written
# database             = "shop"       # the file, for sqlite; the number, for redis
# user                 = "you"
# auth                 = "password"   # password command prompt
# password             = "secret"     # written here, which the file has to be yours alone
# password_env         = "PGPASSWORD" # read from the environment instead
# password_command     = "pass db/shop"   # read from what this command writes
# env                  = "dev"        # dev test prod. prod colours the whole title bar
# mode                 = "write"      # write read-only
# confirm_writes       = "off"        # off delete write. unset: off on dev, delete on test, write on prod
# sslmode              = "prefer"     # disable allow prefer require verify-ca verify-full
# statement_timeout_ms = 0            # 0 leaves the timeout to the server
# keepalive_s          = 30           # seconds between two checks. 0 sends no keepalive
# page_size            = 200          # the rows one page of the grid reads
# command              = "ssh -N -L 5432:db:5432 jump"   # run before the connection opens
# command_timeout      = 10           # seconds the command has to open its port
# wait_for_port        = 5432         # the port the command must open
# autocommit           = true         # false holds a transaction open by hand
# mcp                  = "read-only"  # off read-only read-write full. What an agent may do
#                                     # on this profile, never more than `[mcp] access`
# description          = "what this connection is"
# ai_instructions      = "what the model should know about this database"

# [ui]
# icons               = "plain"   # plain ascii. A glyph below written as nothing turns
#                                 # that one kind off
# theme               = "system"  # system, or a theme the client ships, or one of your own
#                                 # in ~/.config/masume/themes
# hide_system_schemas = true      # false lists pg_catalog and the rest in the tree

# Every glyph the client draws for a kind of thing. A glyph written as nothing
# turns that one kind off.
#
# [ui.icon_glyphs]
# # what a row of the tree is
# schema            = ""
# table             = ""
# view              = ""
# materialized-view = ""
# function          = ""
# sequence          = ""
# type              = ""
# trigger           = ""
# column            = ""
# index             = "▤"
# primary-key       = ""
# foreign-key       = ""
# role              = ""
# roles             = ""
#
# # what the client keeps for you
# favourites = ""
# recent     = ""
# query      = "≡"
# folder     = "▸"
#
# # what a view of the result is
# plan = "⊳"
#
# # what the client says
# note    = ""
# problem = "✗"
# ai      = "✦"
#
# # the marks of a control
# fold-closed = "▸"
# fold-open   = "▾"
# field       = "▸"
# close       = "×"
# dot         = "●"
# sort-up     = "↑"
# sort-down   = "↓"
# prompt      = "❯"
# step-back   = "‹"
# step-on     = "›"
# banner      = "⚑"
# new-tab     = "+"

