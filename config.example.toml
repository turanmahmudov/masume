# masume config. Copy this file to ~/.config/masume/config.toml and edit it.
#
# The path is $XDG_CONFIG_HOME/masume/config.toml. Custom themes go in a `themes` directory
# next to it. When you save a connection in the client, masume writes it back into this file
# and keeps every other line unchanged.
#
# No file that masume reads carries a password. A `password` key is ignored wherever it is
# written, and reported. Use `auth = "keyring"`, `auth = "prompt"`, `password_command`,
# `password_env`, or a `[secret]` store.

# ─────────────────────────────────────────────────────────────────────────────
# Example profiles. One profile is one connection. The name after `profile.` is the
# name shown in the picker.
# ─────────────────────────────────────────────────────────────────────────────

# A local server. The password is asked for at connect time.
[profile.shop]
engine   = "postgres"
host     = "127.0.0.1"
port     = 5432
database = "shop"
user     = "you"
auth     = "prompt"
env      = "dev"
mode     = "write"
sslmode  = "prefer"

# A SQLite file. SQLite needs no host, port or user.
[profile.notes]
engine      = "sqlite"
database    = "~/Documents/notes.db"
env         = "dev"
mode        = "write"
description = "The notes database"

# A production server, read-only. The password comes from a password manager.
[profile.shop-prod]
engine               = "postgres"
host                 = "db.example.com"
port                 = 5432
database             = "shop"
user                 = "reader"
auth                 = "command"
password_command     = "pass db/shop-prod"
env                  = "prod"
mode                 = "read-only"
sslmode              = "verify-full"
statement_timeout_ms = 30000
mcp                  = "read-only"

# A server behind a jump host. The command runs before the connection opens. The client
# waits for the port, and stops the command when the connection closes.
[profile.shop-tunnel]
engine          = "postgres"
host            = "127.0.0.1"
port            = 15432
database        = "shop"
user            = "reader"
auth            = "prompt"
env             = "prod"
mode            = "read-only"
command         = "ssh -N -L 15432:db.internal:5432 jump.example.com"
command_timeout = 10
wait_for_port   = 15432

[ui]
icons               = "plain"
theme               = "system"
hide_system_schemas = true

[keys]
preset = "default"

# ─────────────────────────────────────────────────────────────────────────────
# All other settings. Uncomment a line to set it. The value shown is the default
# used when the line is missing.
# ─────────────────────────────────────────────────────────────────────────────

# A secret store. Declared once, named by any number of profiles with `secret`. The command
# prints one secret, and `{{ref}}` is where the reference of the profile goes. The reference
# is passed as one quoted argument, so it can run nothing of its own. masume knows no tool.
#
# [secret.work]
# command = "op read {{ref}}"
#
# [secret.infra]
# command = "vault kv get -field=password {{ref}}"

# A profile is one connection. The name after `profile.` is the name shown in the picker.
#
# [profile.a-name]
# engine               = "postgres"   # postgres mysql sqlite redis mongodb cockroach
#                                     # timescale redshift neon supabase mariadb tidb
#                                     # planetscale aurora-mysql
# host                 = "127.0.0.1"
# port                 = 5432         # the default port of the engine when not set
# database             = "shop"       # the file path for sqlite, the database number for redis
# user                 = "you"
# auth                 = "password"   # password command prompt keyring secret
#                                     # `password` here means password_env. A `password`
#                                     # key in this file is ignored: no file holds a password
# password_env         = "PGPASSWORD" # read the password from this environment variable
# password_command     = "pass db/shop"   # read the password from the output of this command
# secret               = "work"       # read the password from this [secret] store
# secret_ref           = "op://eng/shop/password"   # the reference in that store
# env                  = "dev"        # dev test prod. prod colours the title bar red
# mode                 = "write"      # write read-only
# confirm_writes       = "off"        # off delete write agent. unset: off on dev, delete on test, write on prod
# write_plan           = "off"        # off count undo. unset: off on dev, count on test, undo on prod
# undo_rows            = 1000         # rows a write plan reads to build an undo. 0 sets no limit
# sslmode              = "prefer"     # disable allow prefer require verify-ca verify-full
# statement_timeout_ms = 0            # time limit per statement. 0 uses the server default
# keepalive_s          = 30           # seconds between connection checks. 0 disables the keepalive
# page_size            = 200          # rows the grid loads per page
# command              = "ssh -N -L 5432:db:5432 jump"   # run before the connection opens
# command_timeout      = 10           # seconds to wait for the command to open its port
# wait_for_port        = 5432         # the port the command must open
# autocommit           = true         # false keeps a transaction open until you commit
# mcp                  = "read-only"  # off read-only read-write full. What an agent can do
#                                     # on this profile. Never more than `[mcp] access`
# description          = "one line about this connection"
# ai_instructions      = "what the model should know about this database"

# [ui]
# icons               = "plain"   # plain ascii
# theme               = "system"  # system, a built-in theme, or a custom theme
#                                 # from ~/.config/masume/themes
# hide_system_schemas = true      # false lists pg_catalog and other system schemas in the tree

# The glyph shown for each kind of item. An empty string disables that glyph.
#
# [ui.icon_glyphs]
# # kinds of rows in the tree
# schema            = ""
# table             = ""
# view              = ""
# materialized-view = ""
# function          = ""
# sequence          = ""
# type              = ""
# trigger           = ""
# column            = ""
# index             = "▤"
# primary-key       = ""
# foreign-key       = ""
# role              = ""
# roles             = ""
#
# # saved items
# favourites = ""
# recent     = ""
# query      = "≡"
# folder     = "▸"
#
# # views of a result
# plan = "⊳"
#
# # message kinds
# note    = ""
# problem = "✗"
# ai      = "✦"
#
# # control glyphs
# fold-closed = "▸"
# fold-open   = "▾"
# field       = "▸"
# close       = "×"
# dot         = "●"
# sort-up     = "↑"
# sort-down   = "↓"
# prompt      = "❯"
# step-back   = "‹"
# step-on     = "›"
# banner      = "⚑"
# new-tab     = "+"

# Colour overrides for the active theme, without a theme file. Every colour name
# from the themes is allowed here.
#
# Named colours. Each entry must be a hex value. An entry of [ui.colors] or [ui.syntax] can
# then use a name from here in place of a hex value.
#
# [ui.palette]
# blue   = "#7aa2f7"
# purple = "#bb9af7"
# red    = "#f7768e"

# The colours of the editor. Each token kind is a table. `fg` and `bg` take a hex value or
# a colour name, and `bold`, `italic` and `underline` are flags. `link` copies another
# highlight first, then the other keys apply on top. See docs/themes.md for every kind.
#
# [ui.syntax]
# keyword    = { fg = "accent", bold = true }
# type       = { fg = "accent_alt" }
# string     = { fg = "success" }
# comment    = { fg = "muted", italic = true }
# number     = { fg = "accent_warm" }
# identifier = { fg = "text" }
# quoted     = { fg = "text" }
# parameter  = { fg = "danger" }
# problem    = { fg = "error", underline = true }
# bracket    = { fg = "on_accent", bg = "accent_alt" }
# guide      = { bg = "header" }
# match      = { fg = "on_accent", bg = "accent_warm" }

# [ui.colors]
# background   = "#16161e"
# panel        = "#1a1b26"
# header       = "#292e42"
# zebra        = "#202331"
# border       = "#3b4261"
# border_focus = "#7aa2f7"
# selection    = "#2a2f45"
# text         = "#c0caf5"
# muted        = "#8b95bf"
# faint        = "#6b74a0"
# accent       = "#7aa2f7"
# accent_alt   = "#bb9af7"
# accent_warm  = "#ff9e64"
# on_accent    = "#16161e"
# info         = "#7dcfff"
# success      = "#9ece6a"
# warning      = "#e0af68"
