# The model the chat asks. A key written here is read from the environment by
# default, which keeps it out of the file.
#
# [ai]
# enabled              = true          # false removes every AI feature: the chat cannot be
#                                      # opened, no AI action is bound, and nothing about AI
#                                      # is drawn or offered anywhere
# default_provider     = "anthropic"   # anthropic openai
# statement_timeout_ms = 30000         # how long a statement the model runs may take
#
# [ai.providers.anthropic]
# model        = "claude-opus-5"
# api_key      = "sk-..."              # written here, or read from the environment below
# api_key_env  = "ANTHROPIC_API_KEY"
# base_url     = "https://api.anthropic.com"
# base_url_env = "ANTHROPIC_BASE_URL"
#
# [ai.providers.openai]
# model        = "gpt-5"
# api_key_env  = "OPENAI_API_KEY"
# base_url_env = "OPENAI_BASE_URL"

# What an agent reaches through the MCP server. A profile may lower its own level
# with `mcp` above; none may raise it past this one.
#
# [mcp]
# profiles   = ["a-name"]    # the profiles the server opens. Empty means none are served
# access     = "read-only"   # off read-only read-write full
# row_limit  = 500           # the rows one read answers
# timeout_ms = 30000         # how long one read may take
