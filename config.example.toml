# masume configuration examples. Values are not all defaults. See docs/configuration.md for defaults and docs/usage.md for workflows.
#
# The user file is $XDG_CONFIG_HOME/masume/config.toml, normally ~/.config/masume/config.toml. Custom themes are in the adjacent themes directory.
# The connection form saves profiles in the user file. Text outside the edited profile block stays unchanged.
#
# Profile passwords in files are ignored. A non-empty password string produces a warning. The configured auth source still applies.
# Password sources are keyring, prompt, password_command, password_env, or a [secret] store. Headless commands cannot prompt.

# ─────────────────────────────────────────────────────────────────────────────
# Example profiles. One profile is one connection. The name after profile. is the picker name.
# ─────────────────────────────────────────────────────────────────────────────

# A local server with a password prompt at connection time.
[profile.shop]
engine   = "postgres"
host     = "127.0.0.1"
port     = 5432
database = "shop"
user     = "you"
auth     = "prompt"
env      = "dev"
mode     = "write"
sslmode  = "prefer"

# A SQLite file. SQLite needs no host, port or user.
[profile.notes]
engine      = "sqlite"
database    = "~/Documents/notes.db"
env         = "dev"
mode        = "write"
description = "The notes database"

# A read-only production server with a password manager.
[profile.shop-prod]
engine               = "postgres"
host                 = "db.example.com"
port                 = 5432
database             = "shop"
user                 = "reader"
auth                 = "command"
password_command     = "pass db/shop-prod"
env                  = "prod"
mode                 = "read-only"
sslmode              = "verify-full"
statement_timeout_ms = 30000
mcp                  = "read-only"

# A server behind a jump host. The command stays in the foreground. The client checks host:wait_for_port before connection.
# Closing the connection stops the running process group. Detached processes are not reliably cleaned up.
[profile.shop-tunnel]
engine          = "postgres"
host            = "127.0.0.1"
port            = 15432
database        = "shop"
user            = "reader"
auth            = "prompt"
env             = "prod"
mode            = "read-only"
command         = "ssh -N -L 15432:db.internal:5432 jump.example.com"
command_timeout = 10
wait_for_port   = 15432

[ui]
icons               = "plain"
theme               = "ayu-dark"
hide_system_schemas = true
key_hints           = "full"

[keys]
preset = "default"

[notebooks]
paths = []

# Notebook directories. The list always holds <project root>/.masume/notebooks and
# $XDG_STATE_HOME/masume/notebooks. See docs/notebooks.md.
#
# [notebooks]
# paths = ["~/notes/sql"]

# ─────────────────────────────────────────────────────────────────────────────
# Setting reference. Commented values include defaults and examples. Connection addresses, credentials, colours and glyph overrides are examples.
# Duplicate table headers are invalid TOML. Settings belong under one header per table.
# ─────────────────────────────────────────────────────────────────────────────

# A secret store is a reusable password command. Each {{ref}} is an unquoted, standalone placeholder for one shell-quoted argument.
# Templates accept literal arguments, quoted flags and pipelines. Shell expansion, redirects, command lists and multiline templates require a script.
# Password commands have no stdin. Commands must exit successfully within 30 seconds and print a non-empty first line.
# Secret stores and password commands belong in the user file. Project profiles cannot set command, password_command, password_env, secret or secret_ref.
#
# [secret.work]
# command = "op read {{ref}}"
#
# [secret.infra]
# command = "vault kv get -field=password {{ref}}"

# A profile is one connection. The name after profile. is the picker name.
#
# [profile.a-name]
# engine               = "postgres"   # postgres mysql sqlite mongodb cockroach
#                                     # timescale redshift neon supabase mariadb tidb
#                                     # planetscale aurora-mysql
# host                 = "127.0.0.1"
# port                 = 5432         # the default port of the engine when not set
# database             = "shop"       # the file path for sqlite
# user                 = "you"
# auth                 = "password"   # password command prompt keyring secret
# The default auth is secret when secret is set, otherwise command when password_command is set, otherwise password.
# auth = "password" reads password_env. A password key in this file is ignored.
# password_env         = "PGPASSWORD" # read the password from this environment variable
# password_command     = "pass db/shop"   # read the password from the output of this command
# secret               = "work"       # read the password from this [secret] store
# secret_ref           = "op://eng/shop/password"   # the reference in that store
# env                  = "dev"        # dev test prod. The theme provides the environment colour.
# mode                 = "write"      # write read-only
# confirm_writes       = "off"        # off delete write agent. unset: off on dev, delete on test, write on prod
# write_plan           = "off"        # off count undo. unset: off on dev, count on test, undo on prod
# undo_rows            = 1000         # Maximum captured target rows. 0 uses an internal ceiling of 1048576.
# sslmode              = "prefer"     # disable allow prefer require verify-ca verify-full
# statement_timeout_ms = 0            # time limit per statement. 0 uses the server default
# keepalive_s          = 30           # seconds between connection checks. 0 disables the keepalive
# page_size            = 200          # rows the grid loads per page
# command              = "ssh -N -L 5432:db:5432 jump"   # run before the connection opens
# command_timeout      = 10           # seconds to wait for the command to open its port
# wait_for_port        = 5432         # The readiness port on host. The database connection still uses port.
# autocommit           = true         # false starts a transaction on TUI execution, until commit or rollback.
# mcp                  = "read-only"  # off read-only read-write full. The default is the global [mcp] access limit.
# description          = "one line about this connection"
# ai_instructions      = "what the model should know about this database"
# description is stored in the form but absent from the picker.
# Environment defaults apply to absent file settings. Changing env in the form does not change confirmation.
# Undo covers eligible single updates, deletes and truncates. Captured target rows exclude cascades and trigger effects.
# A later undo can overwrite newer values. Grid changes and imports retain no undo. See docs/configuration.md for eligibility and failures.
# Unset TLS uses prefer on PostgreSQL, MySQL, MariaDB, CockroachDB, TimescaleDB, TiDB and Aurora MySQL, require on Redshift, Neon, Supabase and PlanetScale, and none on MongoDB.
# MongoDB allow and prefer use TLS without an unencrypted fallback. SQLite ignores TLS.
# Relative SQLite paths in a project file use the project directory. Other relative SQLite paths use the startup directory.

# [ui]
# icons               = "plain"   # plain ascii
# theme               = "ayu-dark" # system, a built-in theme, or a custom theme from the themes directory.
# hide_system_schemas = true      # false lists pg_catalog and other system schemas in the tree
# key_hints           = "full"    # full main off. main names the primary keys only, off names none

