# The database servers for the integration tests. No Go code depends on this file. The tests
# read a connection URL from the environment and connect like any other client.
#
# `docker compose up -d --wait` returns only after every health check passes. So the tests
# never run against a server that is still starting.
#
# The ports are not the default ones, so these containers do not conflict with a local
# server. Each one binds 127.0.0.1, because these servers contain no real data and one of
# them has no password.
name: masume-test

services:
  postgres:
    image: ${MASUME_TEST_POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:55432:5432"
    # tmpfs, because a test database is discarded and never needs to survive a restart.
    # Postgres 18 keeps its data in a subdirectory of this mount.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql:
    image: ${MASUME_TEST_MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: shop
    ports:
      - "127.0.0.1:55306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # MariaDB 11 ships mariadb-admin and no longer ships mysqladmin, so both are tried.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -psecret || mariadb-admin ping -h 127.0.0.1 -psecret"]
      interval: 1s
      timeout: 5s
      retries: 120

  redis:
    image: ${MASUME_TEST_REDIS_IMAGE:-redis:8-alpine}
    ports:
      - "127.0.0.1:55379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 60

  mongo:
    image: ${MASUME_TEST_MONGO_IMAGE:-mongo:8}
    ports:
      - "127.0.0.1:55017:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 1s
      timeout: 5s
      retries: 60

  # A second MongoDB with authentication turned on. A hosted deployment always has it, and
  # the client behaves differently there. The server accepts a ping from anyone and refuses
  # every other command, so a connection check must use one of the accepted commands.
  mongo-auth:
    image: ${MASUME_TEST_MONGO_IMAGE:-mongo:8}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: shop
    ports:
      - "127.0.0.1:55018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "secret",
             "--eval", "db.adminCommand('ping')"]
      interval: 1s
      timeout: 5s
      retries: 60

  # A third MongoDB, as a replica set with one member. Transactions require a replica set.
  # The server listens on the published port instead of the default one, because a replica
  # set advertises the addresses of its members and the tests connect from outside the
  # container.
  mongo-rs:
    image: ${MASUME_TEST_MONGO_IMAGE:-mongo:8}
    command: ["--replSet", "rs0", "--port", "55020", "--bind_ip_all"]
    ports:
      - "127.0.0.1:55020:55020"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 55020 --eval \"
             try { rs.status().ok } catch (e) {
               rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:55020'}]}).ok
             }\" | grep -q 1"]
      interval: 2s
      timeout: 10s
      retries: 60
