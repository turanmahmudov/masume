name: Bug report
description: Report something that the client does wrong.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please do not put a password, a private host name, or
        any real data into this issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the client did, and what you expected it to do.
      placeholder: |
        The grid drew ... , and I expected it to draw ... .
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The shortest list of steps that reproduces the problem every time.
      placeholder: |
        1. Open a PostgreSQL profile.
        2. Run `select 1`.
        3. Press `s` on the first column.
        4. The header marks no sort.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `masume --version`.
      placeholder: masume v0.1.0
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: The engine of the profile where the problem happens.
      options:
        - PostgreSQL
        - MySQL
        - SQLite
        - MongoDB
        - CockroachDB
        - TimescaleDB
        - Redshift
        - Neon
        - Supabase
        - MariaDB
        - TiDB
        - PlanetScale
        - Aurora MySQL
        - Not about an engine
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The version that the server reports, if a server is involved.
      placeholder: PostgreSQL 17.2

  - type: input
    id: platform
    attributes:
      label: Operating system and terminal
      description: The system, the terminal program and its version.
      placeholder: Linux 6.12, WezTerm 20240203
    validations:
      required: true

  - type: textarea
    id: frame
    attributes:
      label: What the screen showed
      description: >
        A screenshot, or the frame as text. `tmux capture-pane -p` writes the frame as
        text. Remove any value you cannot share before you paste it.

  - type: textarea
    id: config
    attributes:
      label: The profile, without its password
      description: The `[profile.…]` block where the problem happens. Remove every password.
      render: toml

  - type: checkboxes
    id: checks
    attributes:
      label: Before you open the issue
      options:
        - label: I searched the open and closed issues for the same report.
          required: true
        - label: This issue contains no password, no private host name and no real data.
          required: true
