name: Engine problem
description: A server that the client opens incorrectly, or cannot open.
labels: ["engine", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a server that does not connect, a catalog read that returns
        wrong data, a plan that the client cannot read, or an engine variant that behaves
        differently from the standard one. Please put no password and no private host name
        in this issue.

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - PostgreSQL
        - MySQL
        - SQLite
        - Redis
        - MongoDB
        - CockroachDB
        - TimescaleDB
        - Redshift
        - Neon
        - Supabase
        - MariaDB
        - TiDB
        - PlanetScale
        - Aurora MySQL
        - An engine that the client does not support yet
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The version that the server reports.
      placeholder: MariaDB 11.4.3
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What goes wrong
      options:
        - The connection is refused or never opens
        - A catalog read returns the wrong data
        - The plan cannot be read
        - The client refuses a statement that the server accepts
        - The DDL is generated incorrectly
        - A type is displayed incorrectly
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the client did, what the server answered, and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The statements that set up the case, if you can share them, and the steps in the
        client. A case that runs against a container from `compose.yaml` is the most useful.
      render: sql

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `masume --version`.
    validations:
      required: true
