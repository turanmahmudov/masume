version: 2

project_name: masume

before:
  hooks:
    - go mod download

builds:
  - id: masume
    main: .
    binary: masume
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/turanmahmudov/masume/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: masume
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - config.example.toml

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/turanmahmudov/masume/{{ .Tag }}/install.sh | MASUME_VERSION={{ .Tag }} sh
    ```

    ```sh
    go install github.com/turanmahmudov/masume@{{ .Tag }}
    ```

    Or take an archive below, unpack it, and put `masume` on the PATH.

    Check what you downloaded against `checksums.txt`:

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```
