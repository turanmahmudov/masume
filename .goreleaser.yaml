version: 2

project_name: masume

before:
  hooks:
    - go mod download

builds:
  - id: masume
    main: .
    binary: masume
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/turanmahmudov/masume/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: masume
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - config.example.toml

nfpms:
  - id: masume
    package_name: masume
    ids: [masume]
    formats: [deb, rpm, apk]
    maintainer: Turan Mahmudov <turan.mahmudov@gmail.com>
    description: A database client for the terminal
    homepage: https://github.com/turanmahmudov/masume
    license: Apache-2.0
    section: database
    contents:
      - src: README.md
        dst: /usr/share/doc/masume/README.md
      - src: config.example.toml
        dst: /usr/share/doc/masume/config.example.toml
      - src: LICENSE
        dst: /usr/share/licenses/masume/LICENSE
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/masume/LICENSE
        packager: deb
      - src: LICENSE
        dst: /usr/share/doc/masume/LICENSE
        packager: apk

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/turanmahmudov/masume/{{ .Tag }}/install.sh | MASUME_VERSION={{ .Tag }} sh
    ```

    ```sh
    npm install -g masume@{{ trimprefix .Tag "v" }}
    ```

    ```sh
    go install github.com/turanmahmudov/masume@{{ .Tag }}
    ```

    Or take an archive, a `.deb`, an `.rpm` or an `.apk` below. Unpack an archive and put `masume` on the PATH.

    Check what you downloaded against `checksums.txt`:

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```
